<script src="jobs-data.js"></script>
<script src="common.js"></script>
<script>
  function jobCardHTML(job){
    const heartOn = job.liked ? 'on' : '';
    const heartChar = job.liked ? '♥' : '♡';
    const closed = job.closed;
    return `
      <div class="job-card" ${job.sponsor ? 'style="border-color:#F0DFAE;"' : ''}>
        <div class="job-top">
          <div class="job-top-left">
            <div class="job-logo"></div>
            <div>
              <div class="job-title">${job.title}</div>
              <div class="job-sub">${job.company} · ${job.location}</div>
            </div>
          </div>
          <button class="job-heart ${heartOn}" onclick="toggleHeart(this,event)">${heartChar}</button>
        </div>
        <div class="job-tags">${job.tags.map(t => `<span class="pill ${t.cls}">${t.t}</span>`).join('')}</div>
        <div class="job-price">${job.price}</div>
        ${closed
          ? `<button class="btn btn-outline" style="opacity:.5;" disabled>지원 마감</button>`
          : `<button class="btn ${job.sponsor ? 'btn-primary' : (job.liked ? 'btn-outline' : 'btn-primary')}" onclick="openJobDetail('${job.id}')">상세보기</button>`}
      </div>`;
  }
  function renderJobs(list){
    document.getElementById('jobGrid').innerHTML = list.map(jobCardHTML).join('');
  }
  function filterJobs(){
    const q = document.getElementById('jobSearch').value.trim().toLowerCase();
    if (!q) { renderJobs(JOBS); return; }
    renderJobs(JOBS.filter(j =>
      j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q) || j.location.toLowerCase().includes(q)
    ));
  }
  document.getElementById('jobSearch').addEventListener('keydown', (e) => { if (e.key === 'Enter') filterJobs(); });
  renderJobs(JOBS);
</script>

          ['undo', 'redo'],
          ['formatBlock', 'fontSize'],
          ['bold', 'underline', 'italic', 'strike'],
          ['fontColor', 'hiliteColor', 'removeFormat'],
          ['align', 'list', 'lineHeight'],
          ['blockquote', 'horizontalRule', 'table', 'link'],
          ['image', 'video'],
          ['fullScreen', 'preview', 'codeView'],
        ],
        formats: ['p', 'h2', 'h3', 'blockquote'],
        fontSize: [13, 14, 15, 16, 18, 20, 24, 28, 32],
        fontSizeUnit: 'px',
        colorList: [
          ['#262B3F', '#4A5170', '#8B90A6', '#2F46D6', '#3FD6A5', '#D33A3A', '#E0A800', '#FFFFFF'],
          ['#EDF1FF', '#DDF7EE', '#FFF3C4', '#FFE4E4', '#F6F7FC'],
        ],
        lineHeights: [{ text: '1.5', value: 1.5 }, { text: '1.85 (기본)', value: 1.85 }, { text: '2.2', value: 2.2 }],
        imageWidth: '100%', imageFileInput: true, imageUrlInput: true, imageAccept: '.jpg,.jpeg,.png,.webp,.gif',
        imageUploadSizeLimit: 20 * 1024 * 1024,
        videoWidth: '100%', videoRatio: 0.5625, videoFileInput: true, videoUrlInput: true,
        videoAccept: '.mp4,.webm,.mov', youtubeQuery: 'rel=0',
        linkTargetNewWindow: true, linkProtocol: 'https://',
        attributesWhitelist: { all: 'style|data-.+', iframe: 'allow|allowfullscreen|frameborder', video: 'controls|playsinline|preload' },
      });
      editor.setContents(draft.body || '');
      editor.onImageUploadBefore = uploadHook('image');
      editor.onVideoUploadBefore = uploadHook('video');
      editor.onImageUploadError = editor.onVideoUploadError = msg => { alert(msg); return false; };
      let last = editor.getContents(true);
      editor.onChange = () => {
        if (!editorReady || !draft) return;
        const html = editor.getContents(true);
        if (html === last) return;
        last = html;
        draft.body = isEmptyBody(html) ? '' : html;
        touched();
      };
      setTimeout(() => { editorReady = true; }, 0);
      // 본문 사진을 누르면 나오는 도구 막대에 '사진 편집' (자르기·대칭·회전·보정)
      if (window.ThumbEditor) ThumbEditor.attachToEditor(editor, {
        upload: async blob => {
          if (!ONLINE) return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
          toast('사진을 올리는 중…');
          return (await api('POST', 'upload', blob, 'image/jpeg')).url;
        },
        onChange: () => { if (editor.onChange) editor.onChange(); },
      });
    }
    function isEmptyBody(html) {
      return !/<(img|video|iframe|hr|table)/i.test(html) && !html.replace(/<[^>]*>/g, '').replace(/&nbsp;|​/g, '').trim();
    }
    function updatePreviewLink() {
      const a = $('previewBtn'); if (a) a.href = SITES[siteOf(draft)].base + 'post.html?preview=1&slug=' + encodeURIComponent(draft.slug || '');
    }
    function showState(text) {
      const s = $('state'); if (!s) return;
      const pub = draft.status === 'published';
      s.textContent = text || (dirty ? (pub ? '저장 안 됨 · 발행 글은 저장을 눌러야 블로그에 반영돼요' : '입력 중…') : (pub ? '저장됨 · 블로그에 공개 중' : '자동 저장됨'));
      s.classList.toggle('dirty', dirty);
    }

    /* 입력 → 표시 → (글감·초안이면) 자동 저장 */
    let autoTimer = null;
    function touched() {
      dirty = true; editVer++;
      showState();
      clearTimeout(autoTimer);
      if (draft.status !== 'published') autoTimer = setTimeout(() => save({ silent: true }), AUTOSAVE_MS);
    }
    function readField(el) {
      const k = el.dataset.k;
      if (k === 'featured') {
        // 추천글은 서비스별 FEAT_MAX(8)개까지, 새로 넣으면 맨 뒤 순서
        const others = featuredOf(siteOf(draft)).filter(p => p.id !== draft.id);
        if (el.checked && !draft.featured && others.length >= FEAT_MAX) { el.checked = false; toast(`추천글은 ${FEAT_MAX}개까지예요. 보드 위 추천글 줄에서 하나를 빼고 넣어 주세요`); }
        else if (el.checked && !draft.featured) draft.featuredOrder = others.reduce((m, p) => Math.max(m, featOrder(p) === 999 ? 0 : featOrder(p)), 0) + 1;
        if (!el.checked) delete draft.featuredOrder;
        draft.featured = el.checked;
      }
      else if (k === 'tags') draft.tags = el.value.split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean);
      else if (k === 'slug') { draft.slug = el.value; draft.slugAuto = !el.value.trim(); }
      else draft[k] = el.value;
    }

    async function save(opts = {}) {
      if (!draft) return false;
      if (saving) { await saving; if (!dirty) return true; }
      if (!draft.title.trim()) {
        if (!opts.silent) alert('제목을 입력하세요.');
        else showState('제목을 적으면 자동 저장돼요');
        return false;
      }
      clearTimeout(autoTimer);
      const ver = editVer;
      const target = draft;
      normalize(target);
      showState('저장 중…');
      saving = storePost(target);
      const ok = await saving;
      saving = null;
      if (draft !== target) return ok;           // 저장 중에 다른 글로 바뀜
      if (ok && ver === editVer) dirty = false;   // 저장하는 동안 더 입력했으면 계속 '입력 중'
      const slugEl = document.querySelector('[data-k="slug"]');
      if (slugEl && document.activeElement !== slugEl) slugEl.value = draft.slug;
      updatePreviewLink();
      showState(ok ? null : '저장하지 못했어요');
      if (ok && !opts.silent) toast(draft.status === 'published' ? '저장했어요 · 블로그에 반영됐어요' : '저장했어요');
      if (dirty && draft.status !== 'published') { clearTimeout(autoTimer); autoTimer = setTimeout(() => save({ silent: true }), AUTOSAVE_MS); }
      return ok;
    }

    async function createAndOpen(fields) {
      const p = newPost(fields);
      if (p.title && !(await storePost(p))) return;
      if (!p.title) { posts.push(p); unsavedIds.add(p.id); }  // 제목이 생기면 그때 저장된다
      openPost(p.id);
    }

    /* ---------- 이벤트: 보드·목록 ---------- */
    $('viewSeg').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      view = b.dataset.view;
      try { localStorage.setItem('selb_write_view', view); } catch (err) {}
      renderMain();
    });
    $('catChips').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      catFilter = b.dataset.cat; renderMain();
    });
    $('search').addEventListener('input', renderMain);
    $('quickForm').addEventListener('submit', async e => {
      e.preventDefault();
      const v = $('quickInput').value.trim();
      const category = $('quickCat').value;
      if (!v) { createAndOpen({ status: 'idea', category }); return; }
      const np = newPost({ title: v, status: 'idea', category });
      normalize(np);
      if (!(await storePost(np))) return;
      $('quickInput').value = '';
      toast('글감을 추가했어요');
    });
    $('main').addEventListener('click', e => {
      const add = e.target.closest('[data-add]');
      if (add) { createAndOpen({ status: add.dataset.add, category: catFilter === 'all' ? $('quickCat').value : catFilter }); return; }
      const th = e.target.closest('th[data-sort]');
      if (th) { const k = th.dataset.sort; sortDir = sortKey === k ? -sortDir : (['date', 'views', 'd7'].includes(k) ? -1 : 1); sortKey = k; renderMain(); return; }
      if (e.target.closest('select, input, .col-tools')) return;
      const unf = e.target.closest('[data-unfeat]');
      if (unf) { toggleFeatured(unf.dataset.unfeat); return; }
      const ftg = e.target.closest('[data-feat]');
      if (ftg) { e.preventDefault(); toggleFeatured(ftg.dataset.feat); return; }
      const fc = e.target.closest('[data-fid]');
      if (fc) { openPost(fc.dataset.fid); return; }
      const box = e.target.closest('[data-box]');
      if (box) { boxTab = box.dataset.box; savePrefs(); renderMain(); return; }
      if (e.target.closest('[data-empty-trash]')) {
        const ids = filtered().filter(p => p.status === 'trash').map(p => p.id);
        if (ids.length && confirm(`휴지통의 글 ${ids.length}개를 영구 삭제할까요?\n되돌릴 수 없습니다.`)) purgePosts(ids).then(ok => ok && toast('휴지통을 비웠어요'));
        return;
      }
      const act = e.target.closest('[data-act]');
      if (act) {
        const id = act.closest('[data-id]').dataset.id, p = posts.find(o => o.id === id), a = act.dataset.act;
        if (a === 'restore') changeStatus(id, p.prevStatus || 'idea', { restore: true });
        else if (a === 'purge') { if (confirm(`"${p.title || '(제목 없음)'}" 글을 영구 삭제할까요?\n되돌릴 수 없습니다.`)) purgePosts([id]).then(ok => ok && toast('영구 삭제했어요')); }
        else changeStatus(id, a);
        return;
      }
      const item = e.target.closest('[data-id]');
      if (item) openPost(item.dataset.id);
    });
    $('main').addEventListener('change', e => {
      const sel = e.target.closest('[data-status-of]');
      if (sel) { changeStatus(sel.dataset.statusOf, sel.value); return; }
      const pref = e.target.closest('[data-pref]');
      if (pref) {
        const st = pref.closest('[data-tools]').dataset.tools;
        colPrefs[st] = Object.assign(prefOf(st), { [pref.dataset.pref]: pref.value });
        savePrefs(); renderMain();
      }
    });
    // 끌어 놓기로 상태 바꾸기
    // 끌어 놓기: 카드 → 칸(상태 바꾸기) / 카드 → 추천글 칸(추천글로) / 추천글 칸끼리(순서 바꾸기)
    let dragFrom = null;
    const clearOver = () => document.querySelectorAll('.col.over, .fslot.over, .feat-bar.over').forEach(x => x.classList.remove('over'));
    $('main').addEventListener('dragstart', e => {
      const c = e.target.closest('.kcard, .fcard'); if (!c) return;
      dragFrom = c.classList.contains('fcard') ? 'feat' : 'card';
      e.dataTransfer.setData('text/plain', c.dataset.id || c.dataset.fid);
      e.dataTransfer.effectAllowed = 'move';
      c.classList.add('dragging');
    });
    $('main').addEventListener('dragend', e => {
      const c = e.target.closest('.kcard, .fcard'); if (c) c.classList.remove('dragging');
      clearOver(); dragFrom = null;
    });
    $('main').addEventListener('dragover', e => {
      const bar = e.target.closest('[data-featbar]');
      if (bar) {
        e.preventDefault(); clearOver(); bar.classList.add('over');
        const slot = e.target.closest('.fslot'); if (slot) slot.classList.add('over');
        return;
      }
      const col = e.target.closest('.col'); if (!col || dragFrom !== 'card') return;
      e.preventDefault();
      clearOver();
      col.classList.add('over');
    });
    $('main').addEventListener('drop', e => {
      const id = e.dataTransfer.getData('text/plain');
      const bar = e.target.closest('[data-featbar]');
      if (bar) {
        e.preventDefault(); clearOver();
        const slot = e.target.closest('.fslot');
        if (id) placeFeatured(id, slot ? +slot.dataset.fslot : FEAT_MAX);
        return;
      }
      const col = e.target.closest('.col'); if (!col || dragFrom !== 'card') return;
      e.preventDefault();
      clearOver();
      if (id) changeStatus(id, col.dataset.status);
    });

    /* ---------- 이벤트: 편집 창 ---------- */
    $('backdrop').addEventListener('click', closeEditor);
    $('drawer').addEventListener('input', e => {
      const el = e.target;
      if (!el.dataset.k || !draft) return;
      readField(el);
      if (el.dataset.k === 'site') {
        // 서비스를 바꾸면 그 서비스의 카테고리로
        draft.category = SITES[draft.site].categories[0].id;
        document.querySelector('[data-k="category"]').innerHTML = SITES[draft.site].categories.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
        // 글 하단 버튼(CTA) 안내도 그 서비스 기본값으로
        const S2 = SITES[draft.site];
        document.querySelector('[data-k="ctaText"]').placeholder = S2.postCtaText;
        document.querySelector('[data-k="ctaUrl"]').placeholder = S2.ctaUrl;
        $('ctaSiteName').textContent = S2.brandName;
        updatePreviewLink();
      }
      touched();
      if (el.dataset.k === 'title' || el.dataset.k === 'category') $('thumbPrev').innerHTML = thumbHTML(draft, 'thumb-sm');
    });
    $('drawer').addEventListener('change', e => {
      const el = e.target;
      if (el.dataset.k && draft && el.type === 'checkbox') { readField(el); touched(); }
    });
    $('drawer').addEventListener('click', async e => {
      if (e.target.id === 'previewBtn' && dirty) {
        e.preventDefault();
        if (await save()) window.open($('previewBtn').href, '_blank');
        return;
      }
      const t = e.target.closest('button'); if (!t || !draft) return;
      if (t.id === 'saveBtn') save();
      else if (t.id === 'closeBtn') closeEditor();
      else if (t.dataset.st) {
        const st = t.dataset.st;
        if (st === draft.status) return;
        if (!draft.title.trim()) { alert('제목을 먼저 적어 주세요.'); return; }
        if (!confirmStatus(draft, st)) return;
        const before = {}; STATUS_KEYS.forEach(k => { if (k in draft) before[k] = draft[k]; });
        applyStatus(draft, st);
        dirty = true; editVer++;
        if (await save({ silent: true })) { refreshStatusUI(); toast(`'${statusLabel(st)}'(으)로 바꿨어요`); }
        else { STATUS_KEYS.forEach(k => delete draft[k]); Object.assign(draft, before); refreshStatusUI(); }
      }
      else if (t.id === 'deleteBtn') {
        const delId = draft.id;
        clearTimeout(autoTimer);
        if (saving) await saving;
        // 아직 저장 안 된 빈 새 글은 그냥 버린다
        if (unsavedIds.has(delId)) { posts = posts.filter(p => p.id !== delId); unsavedIds.delete(delId); dirty = false; await closeEditor(); return; }
        if (draft.status === 'trash') {
          if (!confirm(`"${draft.title || '(제목 없음)'}" 글을 영구 삭제할까요?\n되돌릴 수 없습니다.`)) return;
          dirty = false;
          if (!(await purgePosts([delId]))) return;
          draft = null; $('drawer').hidden = true; $('backdrop').hidden = true; destroyEditor(); $('drawer').innerHTML = ''; renderMain();
          toast('영구 삭제했어요');
          return;
        }
        if (dirty && draft.status !== 'published') await save({ silent: true });
        dirty = false;
        await changeStatus(delId, 'trash');
        if (draft && draft.status === 'trash') await closeEditor();
      }
      else if (t.id === 'thumbUp') {
        // 썸네일 편집 창: 지금 썸네일(없으면 새 사진)을 자르기·대칭·회전·보정
        if (!window.ThumbEditor) { $('thumbFile').click(); return; }
        try {
          const blob = await ThumbEditor.open({ src: draft.thumbnail });
          if (!blob || !draft) return;
          if (ONLINE) { toast('사진을 올리는 중…'); draft.thumbnail = (await api('POST', 'upload', blob, 'image/jpeg')).url; }
          else draft.thumbnail = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
          $('thumbBox').innerHTML = thumbBoxHTML(draft);
          document.querySelector('details.card').open = true;
          touched();
        } catch (err) { alert('썸네일을 바꾸지 못했어요.\n' + err.message); }
      }
      else if (t.id === 'thumbDel') { draft.thumbnail = ''; touched(); $('thumbBox').innerHTML = thumbBoxHTML(draft); }
    });

    $('thumbFile').addEventListener('change', async e => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f || !draft) return;
      try { draft.thumbnail = await imageValue(f, 1200); }
      catch (err) { alert('이미지를 올리지 못했습니다.\n' + err.message); return; }
      $('thumbBox').innerHTML = thumbBoxHTML(draft);
      touched();
    });

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
      else if (e.key === 'Escape' && draft && $('login').hidden && !(e.target.closest && e.target.closest('.sun-editor, .se-dialog'))) closeEditor();
    });
    window.addEventListener('beforeunload', e => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });

    /* ---------- 메뉴 / 내보내기 / 가져오기 ---------- */
    $('menuBtn').addEventListener('click', e => { e.stopPropagation(); $('menu').classList.toggle('open'); });
    document.addEventListener('click', () => $('menu').classList.remove('open'));

    function download(name, text, type) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type }));
      a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    function postsJsText() {
      return '/* SelB 블로그 글 데이터 · 글 관리 페이지에서 내보냄 (' + new Date().toLocaleString('ko-KR') + ') */\n'
        + 'window.BLOG_POSTS = ' + JSON.stringify(posts, null, 2) + ';\n';
    }
    if (!ONLINE) $('exportBtn').addEventListener('click', () => {
      if (dirty && !confirm('저장하지 않은 변경 사항은 빠집니다. 계속할까요?')) return;
      download('posts.js', postsJsText(), 'text/javascript');
      toast('posts.js를 내려받았어요 · blog 폴더의 posts.js를 바꿔 넣으세요');
    });
    if (ONLINE) $('exportJsBtn').addEventListener('click', () => download('posts.js', postsJsText(), 'text/javascript'));
    $('exportJsonBtn').addEventListener('click', () => {
      download('selb-blog-backup-' + todayStr() + '.json', JSON.stringify(posts, null, 2), 'application/json');
    });
    $('importBtn').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', e => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        try {
          const txt = r.result.trim();
          const i = txt.indexOf('['), j = txt.lastIndexOf(']');
          const data = JSON.parse(txt.slice(i, j + 1));
          if (!Array.isArray(data)) throw new Error();
          if (!confirm(`글 ${data.length}개를 불러옵니다. 지금 목록을 모두 이 파일 내용으로 바꿀까요?`)) return;
          const prevPosts = posts;
          posts = migrate(data); posts.forEach(p => { if (!p.id) p.id = uid(); });
          if (!(await persistAll())) { posts = prevPosts; return; }
          dirty = false; if (draft) await closeEditor();
          renderMain(); toast('불러왔어요');
        } catch (err) { alert('파일을 읽지 못했습니다. posts.js 또는 JSON 백업 파일인지 확인하세요.'); }
      };
      r.readAsText(f);
    });
    if (!ONLINE) $('resetBtn').addEventListener('click', async () => {
      if (!confirm('이 브라우저에 저장한 글을 모두 지우고 posts.js 내용으로 되돌릴까요?\n내보내지 않은 글은 사라집니다.')) return;
      clearLocal();
      dirty = false; if (draft) await closeEditor();
      posts = loadAll();
      renderMain(); renderMergeBar(); toast('posts.js 내용으로 되돌렸어요');
    });

    /* ---------- 로그인 (서버) ---------- */
    if (ONLINE) {
      $('loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        $('loginErr').textContent = '';
        try { await api('POST', 'login', { password: $('loginPw').value }); location.reload(); }
        catch (err) { $('loginErr').textContent = err.message; }
      });
      $('logoutBtn').addEventListener('click', async () => {
        if (dirty && !confirm('저장하지 않은 변경 사항이 있습니다. 로그아웃할까요?')) return;
        dirty = false;
        await api('POST', 'logout').catch(() => {});
        location.reload();
      });
      if (!window.BLOG_ADMIN) showLogin();
    }

    /* posts.js에 새로 생긴 글이 있으면 합치기 안내 (파일로 열고 브라우저에 저장된 글이 있을 때만) */
    const SKIP_KEY = 'selb_blog_merge_skip';
    function skipIds() { try { return JSON.parse(localStorage.getItem(SKIP_KEY) || '[]'); } catch (e) { return []; } }
    function renderMergeBar() {
      const bar = $('mergeBar');
      if (!hasLocalPosts()) { bar.hidden = true; return; }
      const have = new Set(posts.map(p => p.id));
      const skip = new Set(skipIds());
      const fresh = (window.BLOG_POSTS || []).filter(p => p.id && !have.has(p.id) && !skip.has(p.id));
      if (!fresh.length) { bar.hidden = true; return; }
      bar.hidden = false;
      bar.innerHTML = `<span>posts.js에 새 글 ${fresh.length}개가 있어요</span>
        <button class="btn btn-sm" id="mergeYes">목록에 합치기</button>
        <button class="btn btn-sm" id="mergeNo">숨기기</button>`;
      $('mergeYes').onclick = () => {
        posts.push(...migrate(clone(fresh)));
        persistLocal(); renderMergeBar(); renderMain(); toast(`새 글 ${fresh.length}개를 합쳤어요`);
      };
      $('mergeNo').onclick = () => {
        try { localStorage.setItem(SKIP_KEY, JSON.stringify([...skip, ...fresh.map(p => p.id)])); } catch (e) {}
        renderMergeBar();
      };
    }

    applySiteUI();
    renderMergeBar();
    renderMain();
    async function loadViews() {
      if (!ONLINE || !window.BLOG_ADMIN) return;
      try { VIEWS = await api('GET', 'views'); renderMain(); } catch (e) {}
    }
    loadViews();
    setInterval(loadViews, 5 * 60 * 1000); // 5분마다 새로

    // 블로그 화면에서 '관리자에서 열기'로 들어오면 그 글의 편집 창을 바로 연다 (/admin?edit=글ID)
    (function () {
      const editId = new URLSearchParams(location.search).get('edit');
      if (!editId) return;
      history.replaceState(null, '', location.pathname);
      const p = posts.find(x => x.id === editId);
      if (!p || (ONLINE && !window.BLOG_ADMIN)) return;
      siteFilter = siteOf(p); catFilter = 'all';
      try { localStorage.setItem('selb_admin_site', siteFilter); } catch (e) {}
      applySiteUI(); renderMain(); openPost(editId);
    })();
  </script>
</body>
</html>

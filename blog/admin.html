<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>글 관리 - SelB BLOG</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/suneditor@2.47.12/dist/css/suneditor.min.css">
  <style>
    body { background: var(--bg-2); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 60px; flex: none; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 20px; }
    .topbar .logo { font-size: 16px; margin-right: auto; }
    .topbar .logo small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 4px; }
    .seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
    .seg button { border: 0; background: none; font: inherit; font-size: 13px; padding: 0 12px; height: 28px; border-radius: 7px; color: var(--ink-2); cursor: pointer; }
    .seg button.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(27,32,51,.12); }

    /* 도구 줄 */
    .toolbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 20px; }
    .quick { display: flex; gap: 6px; flex: 1 1 420px; max-width: 560px; }
    .quick input { flex: 1; min-width: 0; }
    .quick select { width: auto; flex: none; }
    #search { flex: 0 1 220px; }
    .chips { display: flex; gap: 4px; flex-wrap: wrap; }
    .chips button { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; }
    .chips button.on { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
    .merge-bar { width: 100%; background: #FFF8DB; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #7A5B00; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .merge-bar[hidden] { display: none; }
    .merge-bar span { flex: 1; min-width: 140px; }

    input[type=text], input[type=search], input[type=date], input[type=url], select, textarea {
      font: inherit; font-size: 14px; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; background: #fff; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }

    /* 보드 */
    .main { flex: 1; min-height: 0; padding: 0 20px 20px; }
    .board-wrap { height: 100%; display: flex; flex-direction: column; gap: 12px; }
    .board-wrap > .board { flex: 1; min-height: 0; height: auto; }
    .board { height: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, .85fr); gap: 14px; }
    /* 추천글 줄 (보드 위, 블로그 첫 화면 추천글 순서) */
    .feat-bar { flex: none; background: #FFF9E6; border: 1px solid #F3E2A6; border-radius: 14px; padding: 10px 12px 12px; }
    .feat-bar.over { border-color: #E0A800; box-shadow: 0 0 0 2px #FFE89A; }
    .feat-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 8px; flex-wrap: wrap; }
    .feat-head h2 { margin: 0; font-size: 15px; }
    .feat-head .n { font-size: 13px; font-weight: 700; color: #8A6A00; }
    .feat-head .hint { font-size: 12px; color: var(--muted); }
    .feat-slots { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
    .fslot { position: relative; min-width: 0; height: 74px; border-radius: 10px; border: 1.5px dashed #E6D18A; background: rgba(255,255,255,.55); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #B09A55; text-align: center; padding: 4px; }
    .fslot.over { border-color: #E0A800; background: #fff; }
    .fslot .no { position: absolute; left: 7px; top: 5px; font-size: 11px; font-weight: 800; color: #B08900; }
    .fcard { position: relative; width: 100%; height: 74px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; border-radius: 10px; border: 1px solid #EBD58C; background: #fff center / cover no-repeat; padding: 6px 8px; cursor: grab; overflow: hidden; text-align: left; font: inherit; }
    .fcard.has-img::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,.68)); }
    .fcard > * { position: relative; }
    .fcard .no { position: absolute; left: 7px; top: 5px; font-size: 11px; font-weight: 800; color: #B08900; }
    .fcard.has-img .no { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
    .fcard .t { font-size: 12px; font-weight: 700; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .fcard.has-img .t { color: #fff; }
    .fcard .warn-pub { position: absolute; right: 26px; top: 5px; font-size: 10px; font-weight: 700; background: #FFE3E0; color: #B42318; border-radius: 999px; padding: 1px 6px; }
    .fcard .x { position: absolute; right: 4px; top: 3px; width: 20px; height: 20px; border: 0; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--ink-2); font-size: 13px; line-height: 20px; cursor: pointer; padding: 0; }
    .fcard .x:hover { background: #fff; color: #C0392B; }
    .fcard.dragging { opacity: .4; }
    .kcard .feat-tg { border: 0; background: none; padding: 0 2px; font-size: 14px; line-height: 1; color: #C9CDD8; cursor: pointer; }
    .kcard .feat-tg.on { color: #E0A800; }
    .kcard .feat-tg:hover { color: #E0A800; }
    .col-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
    .col-tools select, .col-tools input[type=date] { width: auto; flex: 1 1 0; min-width: 0; font-size: 12px; padding: 3px 6px; border-radius: 7px; height: 28px; }
    .col-tools input[type=date] { flex-basis: 100%; }
    .col.box { background: #F1F1F4; }
    .box-seg { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
    .box-seg button { border: 0; background: none; font: inherit; font-size: 13px; padding: 0 10px; height: 26px; border-radius: 6px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
    .box-seg button.on { background: var(--ink); color: #fff; font-weight: 700; }
    .box-seg small { opacity: .75; margin-left: 2px; }
    .col-head .empty-trash { margin-left: auto; border: 0; background: none; font: inherit; font-size: 12px; color: #C0392B; cursor: pointer; padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
    .col-head .empty-trash:hover { background: #fff; }
    .kcard .k-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .kcard .k-acts span { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--bg-2); border: 1px solid var(--line); color: var(--ink-2); }
    .kcard .k-acts span:hover { border-color: var(--brand); color: var(--brand); }
    .kcard .k-acts span.danger:hover { border-color: #C0392B; color: #C0392B; }
    .kcard.in-trash .k-title { color: var(--muted); }
    .col { background: #EEF0F7; border-radius: 14px; display: flex; flex-direction: column; min-height: 0; min-width: 0; border: 2px solid transparent; }
    .col.over { border-color: var(--brand); background: var(--brand-soft); }
    .col-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
    .col-head h2 { margin: 0; font-size: 15px; }
    .col-head .n { font-size: 13px; color: var(--muted); font-weight: 600; }
    .col-head .add { margin-left: auto; width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; font-size: 18px; color: var(--ink-2); cursor: pointer; }
    .col-head .add:hover { background: #fff; }
    .col-hint { font-size: 12px; color: var(--muted); padding: 0 14px 8px; }
    .col-body { flex: 1; overflow-y: auto; padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .col-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 24px 8px; }
    .kcard { position: relative; display: flex; gap: 10px; text-align: left; width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; cursor: pointer; }
    .kcard:hover { border-color: #C9D0E6; box-shadow: 0 2px 8px rgba(27,32,51,.06); }
    .kcard.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
    .kcard.dragging { opacity: .4; }
    .kcard .k-main { flex: 1; min-width: 0; }
    .kcard .k-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .kcard .k-title { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .kcard .k-memo { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kcard .k-thumb { width: 64px; height: 36px; flex: none; border-radius: 6px; object-fit: cover; background: var(--bg-2); align-self: center; }
    .cat { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
    .cat.news { background: #E6EAFF; color: var(--brand); }
    .cat.brand { background: #E8E9EE; color: var(--ink); }
    .cat.event { background: #FFF1C2; color: #8A6A00; }
    .cat.field { background: #E3E9FF; color: #1E3A8A; }
    .cat.service { background: #EDE7FF; color: #5B21B6; }
    .cat.guide { background: #DDF6F6; color: #0E6E76; }
    .cat.insight { background: #F1E8FF; color: #6D28D9; }
    .topbar .logo { margin-right: 0; }
    .topbar-gap { flex: 1; }
    .site-tabs { display: flex; gap: 4px; margin-left: 12px; }
    .site-tabs button { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
    .site-tabs button .dot { width: 8px; height: 8px; border-radius: 50%; }
    .site-tabs button small { font-size: 12px; color: var(--muted); font-weight: 500; }
    .site-tabs button.on { border-color: var(--ink); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    @media (max-width: 900px) { .site-tabs { margin-left: 4px; } .site-tabs button { padding: 0 10px; } .site-tabs button small { display: none; } }
    .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
    .badge.idea { background: #FFF3C4; color: #8A6A00; }
    .badge.draft { background: #E8ECF5; color: var(--ink-2); }
    .badge.published { background: #DDF7EE; color: #0E8A60; }
    .star { color: #E0A800; }
    .kcard .views { margin-left: auto; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
    .kcard .views small { color: #0E8A60; font-weight: 600; font-size: 11px; }
    .list td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink-2); }
    .ed-views { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
    /* 설문 결과 */
    body.view-wide .toolbar { display: none; }
    body.view-wide .main { padding-top: 16px; }
    /* 설정 */
    .st-wrap { height: 100%; overflow-y: auto; }
    .st-wrap > .inner { max-width: 980px; margin: 0 auto; padding-bottom: 40px; }
    .st-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
    .st-card h3 { margin: 0 0 4px; font-size: 16px; }
    .st-card > p.d { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
    .st-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .st-head .st-state { margin-right: auto; font-size: 13px; color: var(--muted); }
    .st-head .st-state.dirty { color: #D07A00; font-weight: 600; }
    .st-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 18px; }
    .st-field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
    .st-field small { font-weight: 400; color: var(--muted); }
    .st-field .unit { display: flex; align-items: center; gap: 6px; }
    .st-field .unit input { width: 90px; font: inherit; font-size: 14px; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; }
    .st-field .unit input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
    .st-field .unit span { font-weight: 500; color: var(--ink-2); }
    .st-switch { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
    .st-switch input { width: 18px; height: 18px; accent-color: var(--brand); }
    .btn:disabled { opacity: .45; cursor: default; }
    .ad-cats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 10px 0 14px 28px; font-size: 14px; font-weight: 600; }
    .ad-cats label { display: inline-flex; align-items: center; gap: 6px; }
    .ad-cats input { width: 16px; height: 16px; accent-color: var(--brand); }
    .ad-cats .off { color: var(--muted); }
    .ad-run { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
    .ad-run select { width: auto; padding: 6px 9px; }
    .ad-log { margin-top: 12px; font-size: 13px; }
    .ad-row { display: grid; grid-template-columns: 110px 54px 40px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
    .ad-row:last-child { border-bottom: 0; }
    .ad-row .t, .ad-row .w { color: var(--muted); font-variant-numeric: tabular-nums; }
    .ad-row .c { font-weight: 700; }
    .ad-row.fail .r { color: #D33A3A; }
    .ad-row .r a { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
    .ad-row small { color: var(--muted); margin-left: 4px; }
    @media (max-width: 640px) { .ad-row { grid-template-columns: 1fr 1fr; } .ad-row .r { grid-column: 1 / -1; } }
    .st-q { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; background: var(--bg-2); }
    .st-q .row1 { display: grid; grid-template-columns: 130px 1fr 150px 120px auto; gap: 8px; align-items: end; }
    .st-q .row2 { display: grid; grid-template-columns: 1fr 260px; gap: 8px; margin-top: 8px; }
    .st-q label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .st-q textarea { min-height: 86px; resize: vertical; font-size: 13px; }
    .st-q .tools { display: flex; gap: 4px; }
    .st-q .tools button { height: 36px; min-width: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; font-size: 13px; cursor: pointer; }
    .st-q .tools button.danger { color: #D33A3A; }
    .st-q .qid { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .st-q .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
    @media (max-width: 900px) { .st-grid { grid-template-columns: 1fr 1fr; } .st-q .row1, .st-q .row2 { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .st-grid, .st-q .row1, .st-q .row2 { grid-template-columns: 1fr; } }
    .sv-wrap { height: 100%; overflow-y: auto; }
    .sv-period { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 14px; }
    .sv-period .seg button { padding: 0 11px; }
    .sv-period .sv-pfsel { display: inline-flex; gap: 6px; }
    .sv-period .sv-pfsel select { width: auto; padding: 5px 8px; font-size: 13px; }
    .sv-filter-note { background: #FFF8DB; color: #7A5B00; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }
    .sv-filter-note a { color: inherit; font-weight: 700; margin-left: 6px; }
    .sv-pf-grid { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 900px) { .sv-pf-grid { grid-template-columns: 1fr; } }
    .sv-period .sv-range { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-right: auto; }
    .sv-period .sv-dates { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
    .sv-period .sv-dates input { width: auto; padding: 5px 8px; font-size: 13px; }
    .sv-chart { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding-top: 18px; }
    .sv-chart .ch { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
    .sv-chart .bar { width: 100%; max-width: 34px; min-height: 2px; background: var(--brand); border-radius: 4px 4px 0 0; opacity: .85; }
    .sv-chart .ch:hover .bar { opacity: 1; }
    .sv-chart .v { font-size: 10px; color: var(--ink-2); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
    .sv-chart .d { position: absolute; bottom: -18px; font-size: 10px; color: var(--muted); white-space: nowrap; }
    .sv-chart + * { margin-top: 22px; }
    .sv-box:has(.sv-chart) { padding-bottom: 30px; }
    .sv-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; margin-bottom: 14px; }
    .sv-sum b { font-size: 22px; letter-spacing: -.02em; }
    .sv-sum span { font-size: 13px; color: var(--muted); display: block; }
    .sv-sum .sv-note { margin-left: auto; font-size: 12px; color: var(--muted); max-width: 420px; }
    .sv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-bottom: 14px; }
    .sv-q { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
    .sv-q .tp { font-size: 11px; font-weight: 700; color: var(--brand); }
    .sv-q h4 { margin: 4px 0 2px; font-size: 15px; }
    .sv-q .cnt { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .sv-q .avg { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
    .sv-bar { display: grid; grid-template-columns: 112px 1fr 64px; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
    .sv-bar .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
    .sv-bar .tr { display: block; height: 10px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
    .sv-bar .fl { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
    .sv-bar .pc { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .sv-box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
    .sv-box h3 { margin: 0 0 10px; font-size: 15px; }
    .sv-box table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .sv-box th, .sv-box td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    .sv-box th { color: var(--muted); font-weight: 600; font-size: 12px; }
    .sv-box td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .sv-box tr[data-id] { cursor: pointer; }
    .sv-box tr[data-id]:hover td { background: var(--bg-2); }
    .sv-cm { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .sv-cm:last-child { border-bottom: 0; }
    .sv-cm .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .sv-empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
    .warn { color: #D07A00; font-weight: 700; }

    /* 목록(표) */
    .table-wrap { height: 100%; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; }
    table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
    .list th { position: sticky; top: 0; background: #fff; text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
    .list th.sorted { color: var(--ink); }
    .list td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .list tr.row { cursor: pointer; }
    .list tr.row:hover td { background: var(--bg-2); }
    .list tr.row.on td { background: var(--brand-soft); }
    .list .t { font-weight: 600; }
    .list .memo { font-size: 12px; color: var(--muted); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list .th-img { width: 56px; height: 32px; border-radius: 5px; object-fit: cover; display: block; background: var(--bg-2); }
    .list select { width: auto; padding: 4px 8px; font-size: 13px; }
    .list .nowrap { white-space: nowrap; color: var(--ink-2); }

    /* 편집 창 (오른쪽에서 열림) */
    .backdrop { position: fixed; inset: 0; background: rgba(27,32,51,.28); z-index: 40; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(1080px, 100%); background: var(--bg-2); z-index: 41; display: flex; flex-direction: column; box-shadow: -12px 0 40px rgba(27,32,51,.18); }
    .backdrop[hidden], .drawer[hidden] { display: none; }
    .ed-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); }
    .ed-head .state { font-size: 13px; color: var(--muted); margin-right: auto; }
    .ed-head .state.dirty { color: #D07A00; }
    .ed-body { flex: 1; overflow-y: auto; padding: 20px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
    .card h3 { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); }
    .card h3 small { font-weight: 400; color: var(--muted); }
    .title-input { font-size: 22px !important; font-weight: 700; padding: 10px 12px !important; border-color: transparent !important; background: var(--bg-2) !important; }
    .title-input:focus { background: #fff !important; border-color: var(--brand) !important; }
    .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
    .meta-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
    .meta-row select, .meta-row input[type=date] { width: auto; padding: 6px 9px; }
    .status-seg button { height: 32px; padding: 0 14px; }
    .status-seg button.on.idea { background: #FFF3C4; color: #8A6A00; }
    .status-seg button.on.draft { background: #E8ECF5; }
    .status-seg button.on.published { background: #DDF7EE; color: #0E8A60; }
    .status-seg button.on.hold { background: #EFE7FB; color: #6B3FB8; }
    textarea.memo { min-height: 110px; resize: vertical; background: #FFFCEF; border-color: #F1E5B5; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .col-2 { grid-column: span 2; } .col-4 { grid-column: 1 / -1; }
    label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
    label.f small { font-weight: 400; color: var(--muted); }
    .thumb-box { display: flex; gap: 16px; align-items: center; margin-top: 14px; }
    .thumb-box .thumb { width: 220px; flex: none; }
    .thumb-box .btns { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .thumb-box small { font-size: 12px; color: var(--muted); }
    details.card > summary { cursor: pointer; font-size: 14px; font-weight: 700; color: var(--ink-2); list-style: none; }
    details.card > summary::before { content: '▸ '; }
    details.card[open] > summary::before { content: '▾ '; }
    details.card[open] > summary { margin-bottom: 12px; }

    /* 본문 에디터 (SunEditor) */
    .body-card { padding: 0; overflow: visible; }
    .body-card > h3 { padding: 16px 20px 0; }
    .body-card .help { padding: 0 20px 14px; }
    .ed-body .sun-editor { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); font-family: inherit; }
    /* 편집 창을 내려도 도구 막대가 위에 붙어 있게 */
    .ed-body .sun-editor .se-toolbar { position: sticky; top: -20px; z-index: 6; background: #fff; outline: 0; border-bottom: 1px solid var(--line); padding: 4px 8px; }
    .ed-body .sun-editor .se-btn-module-border { border-color: transparent; }
    .ed-body .sun-editor .se-wrapper { background: #fff; }
    .ed-body .sun-editor-editable { padding: 28px 40px 60px; max-width: 820px; margin: 0 auto; }
    .ed-body .sun-editor .se-resizing-bar { border-radius: 0 0 var(--radius) var(--radius); }
    /* 에디터 안 글 모양을 실제 블로그 글과 비슷하게 */
    .sun-editor-editable h2 { font-size: 25px; line-height: 1.4; margin: 40px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .sun-editor-editable h3 { font-size: 20px; margin: 30px 0 10px; }
    .sun-editor-editable blockquote { margin: 20px 0; padding: 16px 20px; background: var(--brand-soft); border: 0 !important; border-radius: 12px; color: var(--ink); }
    .sun-editor-editable hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
    .sun-editor-editable figcaption { text-align: center; font-size: 14px; color: var(--muted); background: none !important; }
    .help { font-size: 12px; color: var(--muted); margin-top: 8px; }

    .menu { position: relative; }
    .menu-pop { display: none; position: absolute; right: 0; top: 40px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-width: 220px; z-index: 20; box-shadow: 0 8px 24px rgba(27,32,51,.1); }
    .menu.open .menu-pop { display: block; }
    .menu-pop button { display: block; width: 100%; text-align: left; border: 0; background: none; font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 6px; cursor: pointer; }
    .menu-pop button:hover { background: var(--bg-2); }
    .menu-pop .danger { color: #D33A3A; }
    .menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

    .login { position: fixed; inset: 0; z-index: 50; background: var(--bg-2); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login[hidden] { display: none; }
    .login form { width: min(360px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px; }
    .login h2 { margin: 0 0 4px; font-size: 20px; }
    .login p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    .login input { height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font: inherit; }
    .login .err { color: #D33A3A; font-size: 13px; min-height: 18px; margin: 0; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 14px; display: none; z-index: 60; }

    @media (max-width: 900px) {
      .topbar { padding: 0 12px; gap: 8px; }
      .topbar .hide-m { display: none; }
      .toolbar { padding: 12px; }
      .quick, #search { flex: 1 1 100%; max-width: none; }
      .main { padding: 0 0 12px; }
      /* 보드: 칸을 옆으로 넘겨 보기 */
      .board { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 12px; gap: 10px; }
      .col { flex: 0 0 86%; scroll-snap-align: center; }
      .feat-bar { margin: 0 12px; }
      .feat-slots { display: flex; overflow-x: auto; }
      .fslot, .feat-slots > .fcard { flex: 0 0 132px; }
      .table-wrap { margin: 0 12px; height: 100%; }
      .list .hide-m { display: none; }
      .ed-head { padding: 10px 12px; flex-wrap: wrap; }
      .ed-head .state { order: 9; width: 100%; margin: 0; }
      .ed-body { padding: 12px; }
      .card { padding: 16px; }
      .grid { grid-template-columns: 1fr 1fr; }
      .body-area { grid-template-columns: 1fr; }
      .thumb-box { flex-direction: column; align-items: flex-start; }
      .thumb-box .thumb { width: 100%; }
    }
    /* 휴대폰: 맨 위 줄을 두 줄로(로고·서비스·더보기 / 보기 전환), 편집 도구는 한 줄로 옆으로 넘겨 쓰기 */
    @media (max-width: 640px) {
      body { height: 100dvh; }
      .topbar { height: auto; flex-wrap: wrap; row-gap: 8px; padding: 8px 12px; }
      .site-tabs { margin-left: 2px; min-width: 0; }
      .site-tabs button { height: 34px; padding: 0 10px; font-size: 13px; }
      #viewSeg { order: 10; width: 100%; }
      #viewSeg button { flex: 1; height: 30px; }
      .menu-pop .only-m { display: block; }
      .toolbar { gap: 8px; padding: 10px 12px; }
      .chips { flex-wrap: nowrap; overflow-x: auto; width: 100%; scrollbar-width: none; }
      .chips::-webkit-scrollbar { display: none; }
      .chips button { flex: none; }
      .col { flex-basis: 88%; }
      .ed-body { padding: 10px; }
      .card { padding: 14px; border-radius: 12px; }
      .title-input { font-size: 18px !important; }
      .body-card > h3 { padding: 14px 14px 0; }
      .body-card .help { padding: 0 14px 12px; }
      .ed-body .sun-editor .se-toolbar { top: -10px; padding: 4px; }
      .ed-body .sun-editor-editable { padding: 18px 16px 40px; }
      .sun-editor-editable h2 { font-size: 21px; margin-top: 32px; }
      .sun-editor .se-toolbar .se-btn-tray { display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
      .sun-editor .se-toolbar .se-btn-tray::-webkit-scrollbar { display: none; }
      .sun-editor .se-toolbar .se-btn-module { flex: none; float: none; }
    }
    .menu-pop .only-m { display: none; }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .col-2 { grid-column: 1 / -1; }
      .topbar .logo-txt { display: none; }
      .pv { min-height: 320px; padding: 4px 16px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="logo" href="/admin"><span class="logo-mark">B</span><span class="logo-txt">블로그 <b>관리</b></span></a>
    <div class="site-tabs" id="siteTabs" aria-label="서비스"></div>
    <span class="topbar-gap"></span>
    <div class="seg" id="viewSeg">
      <button data-view="board">보드</button>
      <button data-view="list">목록</button>
      <button data-view="survey">설문</button>
      <button data-view="settings">설정</button>
    </div>
    <a class="btn btn-sm hide-m" id="viewBlog" href="index.html" target="_blank">블로그 보기</a>
    <button class="btn btn-sm btn-primary local-only hide-m" id="exportBtn">posts.js 내보내기</button>
    <div class="menu" id="menu">
      <button class="btn btn-sm" id="menuBtn" aria-label="더보기">···</button>
      <div class="menu-pop">
        <a class="only-m" href="index.html" target="_blank" id="viewBlogM" style="padding:9px 12px;font-size:14px;color:inherit;text-decoration:none">블로그 보기</a>
        <button id="importBtn">파일에서 가져오기 (.js / .json)</button>
        <button id="exportJsonBtn">JSON 백업 내려받기</button>
        <button id="exportJsBtn" class="online-only">posts.js 형식으로 내려받기</button>
        <hr>
        <button id="resetBtn" class="danger local-only">브라우저 저장 내용 지우기</button>
        <button id="logoutBtn" class="online-only">로그아웃</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".js,.json" hidden>
  </div>

  <div class="toolbar">
    <form class="quick" id="quickForm">
      <input type="text" id="quickInput" placeholder="글감 한 줄 적고 Enter" autocomplete="off">
      <select id="quickCat" aria-label="카테고리"></select>
      <button class="btn" type="submit">추가</button>
    </form>
    <input type="search" id="search" placeholder="제목·메모·태그 검색">
    <div class="chips" id="catChips"></div>
    <div class="merge-bar" id="mergeBar" hidden></div>
  </div>

  <main class="main" id="main"></main>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="글 편집"></aside>

  <input type="file" id="thumbFile" accept="image/*" hidden>
  <div class="toast" id="toast"></div>
  <div class="login" id="login" hidden>
    <form id="loginForm">
      <h2>글 관리 로그인</h2>
      <p>관리자 비밀번호를 입력하세요.</p>
      <input type="password" id="loginPw" autocomplete="current-password" placeholder="비밀번호" required>
      <p class="err" id="loginErr"></p>
      <button class="btn btn-primary" type="submit">로그인</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/suneditor@2.47.12/dist/suneditor.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/suneditor@2.47.12/src/lang/ko.js"></script>
  <script src="posts.js?all=1"></script>
  <script src="assets/common.js"></script>
  <script src="assets/thumb-editor.js"></script>
  <script>
    let posts = loadAll();
    posts.forEach(p => { if (!p.id) p.id = uid(); });
    let draft = null;          // 편집 중인 글 복사본
    let dirty = false;
    let editVer = 0;           // 입력할 때마다 증가 (자동 저장 중 입력 감지)
    let saving = null;         // 진행 중인 저장(Promise)
    const unsavedIds = new Set(); // 아직 한 번도 저장되지 않은 새 글
    let catFilter = 'all';
    let sortKey = 'date', sortDir = -1;
    let VIEWS = {};   // 글별 조회수 { id: { total, d7, today } }
    const vw = id => VIEWS[id] || { total: 0, d7: 0, today: 0 };
    const fmtN = n => Number(n || 0).toLocaleString('ko-KR');
    let view = 'board';
    let siteFilter = 'selb';
    try { if (SITES[localStorage.getItem('selb_admin_site')]) siteFilter = localStorage.getItem('selb_admin_site'); } catch (e) {}
    const curSite = () => SITES[siteFilter];
    try { view = localStorage.getItem('selb_write_view') || 'board'; } catch (e) {}
    const AUTOSAVE_MS = 1200;

    function uid() { return Math.random().toString(36).slice(2, 10); }
    function $(id) { return document.getElementById(id); }
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.style.display = 'block';
      clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2200);
    }
    function clone(o) { return JSON.parse(JSON.stringify(o)); }

    /* ---------- 저장소: 서버에서는 DB(API), 파일로 열면 브라우저 저장소 ---------- */
    document.querySelectorAll(ONLINE ? '.local-only' : '.online-only').forEach(el => el.remove());
    async function api(method, path, body, contentType) {
      const opt = { method, headers: {}, credentials: 'same-origin' };
      if (body !== undefined) {
        opt.headers['content-type'] = contentType || 'application/json';
        opt.body = contentType ? body : JSON.stringify(body);
      }
      const r = await fetch('/api/' + path, opt);
      const data = await r.json().catch(() => ({}));
      if (r.status === 401 && path !== 'login') { showLogin('로그인이 만료되었어요. 다시 로그인하세요.'); throw new Error('로그인이 필요합니다'); }
      if (!r.ok) throw new Error(data.error || ('오류 ' + r.status));
      return data;
    }
    function persistLocal() {
      try { saveAll(posts); return true; }
      catch (e) {
        alert('브라우저 저장 공간이 부족합니다. 큰 이미지를 줄이거나 지운 뒤 다시 저장하세요.\n(먼저 posts.js 내보내기로 백업해 두는 것을 권장합니다)');
        return false;
      }
    }
    async function persistOne(p) {
      if (!ONLINE) return persistLocal();
      try { await api('PUT', 'posts/' + p.id, p); return true; }
      catch (e) { alert('저장하지 못했습니다.\n' + e.message); return false; }
    }
    async function persistDelete(id) {
      if (!ONLINE) return persistLocal();
      try { await api('DELETE', 'posts/' + id); return true; }
      catch (e) { alert('삭제하지 못했습니다.\n' + e.message); return false; }
    }
    async function persistAll() {
      if (!ONLINE) return persistLocal();
      try { await api('PUT', 'posts', posts); return true; }
      catch (e) { alert('저장하지 못했습니다.\n' + e.message); return false; }
    }
    /* 이미지: 서버에서는 R2에 올리고 주소를, 파일로 열면 data URL을 쓴다 */
    async function imageValue(file, maxW) {
      const dataUrl = await compressImage(file, maxW, 0.82);
      if (!ONLINE) return dataUrl;
      const blob = await (await fetch(dataUrl)).blob();
      toast('이미지를 올리는 중…');
      const { url } = await api('POST', 'upload', blob, 'image/jpeg');
      return url;
    }
    function compressImage(file, maxW, quality) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
            ctx.drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = r.result;
        };
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }
    function showLogin(msg) {
      $('login').hidden = false;
      $('loginErr').textContent = msg || '';
      setTimeout(() => $('loginPw').focus(), 0);
    }

    function newPost(fields) {
      return Object.assign({
        id: uid(), site: siteFilter, slug: '', slugAuto: true, title: '', category: curSite().categories[0].id, status: 'idea',
        date: todayStr(), created: todayStr(), createdAt: Date.now(), summary: '', tags: [], thumbnail: '', featured: false,
        ctaText: '', ctaUrl: '', memo: '', body: '', images: {},
      }, fields || {});
    }

    /* 저장 전에 주소·이미지 정리. 주소는 발행 전까지 제목을 따라간다 (직접 고치면 고정) */
    function normalize(p) {
      const autoSlug = p.status !== 'published' && (!p.slug || p.slugAuto);
      if (autoSlug && p.title.trim()) { p.slug = makeSlug(p.title); p.slugAuto = true; }
      else if (p.slug) p.slug = makeSlug(p.slug);
      if (p.slug) {
        let base = p.slug, n = 2;
        while (posts.some(o => o.slug === p.slug && o.id !== p.id)) p.slug = base + '-' + n++;
      }
      if (p.status === 'published' && !p.date) p.date = todayStr();
      if (!p.created) p.created = p.date || todayStr();   // 예전 글은 그때 날짜를 작성일로
      const used = {};
      Object.keys(p.images || {}).forEach(id => { if ((p.body || '').includes('img:' + id)) used[id] = p.images[id]; });
      p.images = used;
    }

    /* 하나의 글 저장 (목록 갱신 포함) */
    async function storePost(p) {
      const idx = posts.findIndex(o => o.id === p.id);
      const prev = idx >= 0 ? posts[idx] : null;
      const copy = clone(p);
      if (idx >= 0) posts[idx] = copy; else posts.push(copy);
      if (!(await persistOne(copy))) {
        if (idx >= 0) posts[idx] = prev; else posts.splice(posts.indexOf(copy), 1);
        return false;
      }
      unsavedIds.delete(p.id);
      renderMain();
      return true;
    }

    /* ---------- 상단 필터 ---------- */
    function renderSiteTabs() {
      $('siteTabs').innerHTML = Object.values(SITES).map(s => {
        const n = posts.filter(p => siteOf(p) === s.id && p.status !== 'trash').length;
        return `<button data-site="${s.id}" class="${s.id === siteFilter ? 'on' : ''}"><span class="dot" style="background:${s.color}"></span>${esc(s.brandName)} <small>${n}</small></button>`;
      }).join('');
    }
    function applySiteUI() {
      $('quickCat').innerHTML = curSite().categories.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
      $('viewBlog').href = $('viewBlogM').href = curSite().base;
      $('quickInput').placeholder = curSite().brandName + ' 글감 한 줄 적고 Enter';
    }
    $('siteTabs').addEventListener('click', e => {
      const b = e.target.closest('[data-site]'); if (!b || b.dataset.site === siteFilter) return;
      siteFilter = b.dataset.site; catFilter = 'all';
      try { localStorage.setItem('selb_admin_site', siteFilter); } catch (err) {}
      applySiteUI(); renderMain();
    });
    function sitePostsAdmin() { return posts.filter(p => siteOf(p) === siteFilter); }
    function renderChips() {
      const chips = [{ id: 'all', label: '전체' }, ...curSite().categories];
      renderSiteTabs();
      const mine = sitePostsAdmin().filter(p => p.status !== 'trash');
      $('catChips').innerHTML = chips.map(c => {
        const n = c.id === 'all' ? mine.length : mine.filter(p => p.category === c.id).length;
        return `<button data-cat="${c.id}" class="${catFilter === c.id ? 'on' : ''}">${c.label} ${n}</button>`;
      }).join('');
      $('viewSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
    }
    function filtered() {
      const q = $('search').value.trim().toLowerCase();
      return sitePostsAdmin()
        .filter(p => catFilter === 'all' || p.category === catFilter)
        .filter(p => !q || [p.title, p.memo, p.summary, (p.tags || []).join(' ')].join(' ').toLowerCase().includes(q));
    }

    /* ---------- 보드 / 목록 ---------- */
    const COL_HINT = {
      idea: '떠오른 주제를 쌓아 두는 곳 · 작성일 기준', draft: '본문을 쓰는 중인 글 · 작성일 기준', published: '블로그에 공개된 글 · 발행일 기준',
      hold: '잠시 미뤄 둔 글 · 블로그에 공개되지 않아요', trash: '지운 글 · 복원하거나 영구 삭제할 수 있어요',
    };
    /* 칸별 정렬·기간 (이 브라우저에 기억) */
    const DAY_FILTERS = [{ id: 'all', label: '전체 기간' }, { id: 'today', label: '오늘' }, { id: '7d', label: '최근 7일' }, { id: '30d', label: '최근 30일' }, { id: 'day', label: '날짜 지정' }];
    let colPrefs = {};
    try { colPrefs = JSON.parse(localStorage.getItem('selb_admin_colprefs') || '{}') || {}; } catch (e) {}
    let boxTab = 'hold';
    try { if (localStorage.getItem('selb_admin_box') === 'trash') boxTab = 'trash'; } catch (e) {}
    const prefOf = id => Object.assign({ sort: 'new', range: 'all', day: todayStr() }, colPrefs[id] || {});
    function savePrefs() { try { localStorage.setItem('selb_admin_colprefs', JSON.stringify(colPrefs)); localStorage.setItem('selb_admin_box', boxTab); } catch (e) {} }
    function shiftDay(d, n) { const t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() + n); return localDay(t.getTime()); }
    function colItems(list, status) {
      const pf = prefOf(status), today = todayStr();
      const from = pf.range === 'today' ? today : pf.range === '7d' ? shiftDay(today, -6) : pf.range === '30d' ? shiftDay(today, -29) : '';
      return list.filter(p => p.status === status)
        .filter(p => { const d = postDay(p); return pf.range === 'all' ? true : pf.range === 'day' ? d === pf.day : (d >= from && d <= today); })
        .sort((a, b) => postStamp(b).localeCompare(postStamp(a)) * (pf.sort === 'old' ? -1 : 1));
    }
    function colToolsHTML(status) {
      const pf = prefOf(status);
      return `<div class="col-tools" data-tools="${status}">
        <select data-pref="sort" aria-label="정렬"><option value="new" ${pf.sort === 'new' ? 'selected' : ''}>최신순</option><option value="old" ${pf.sort === 'old' ? 'selected' : ''}>오래된순</option></select>
        <select data-pref="range" aria-label="기간">${DAY_FILTERS.map(f => `<option value="${f.id}" ${pf.range === f.id ? 'selected' : ''}>${f.label}</option>`).join('')}</select>
        ${pf.range === 'day' ? `<input type="date" data-pref="day" value="${esc(pf.day)}" aria-label="날짜">` : ''}
      </div>`;
    }
    function cardHTML(p) {
      const memo = (p.memo || '').split('\n').find(l => l.trim()) || '';
      const hasWarn = /⚠|\[ *\]/.test((p.memo || '') + (p.body || ''));
      const acts = p.status === 'hold'
        ? `<div class="k-acts"><span data-act="idea">글감으로</span><span data-act="draft">초안으로</span><span data-act="trash" class="danger">삭제</span></div>`
        : p.status === 'trash'
        ? `<div class="k-acts"><span data-act="restore">복원 (${esc(statusLabel(p.prevStatus || 'idea'))})</span><span data-act="purge" class="danger">영구 삭제</span></div>` : '';
      return `<button class="kcard ${draft && draft.id === p.id ? 'on' : ''} ${p.status === 'trash' ? 'in-trash' : ''}" draggable="true" data-id="${p.id}">
        <div class="k-main">
          <div class="k-meta"><span class="cat ${esc(p.category)}">${esc(catLabel(p.category))}</span>${p.status !== 'trash' ? `<span class="feat-tg ${p.featured ? 'on' : ''}" data-feat="${p.id}" title="${p.featured ? '추천글에서 빼기' : '추천글로 넣기'}">${p.featured ? '★' : '☆'}</span>` : ''}${hasWarn ? '<span class="warn" title="확인할 곳이 있어요">⚠</span>' : ''}<span title="${postDayLabel(p)}일">${postDayLabel(p)} ${fmtDate(postDay(p))}</span>${p.status === 'published' ? `<span class="views" title="전체 조회 ${fmtN(vw(p.id).total)} · 최근 7일 ${fmtN(vw(p.id).d7)}">👁 ${fmtN(vw(p.id).total)}${vw(p.id).d7 ? ` <small>+${fmtN(vw(p.id).d7)}</small>` : ''}</span>` : ''}</div>
          <div class="k-title">${esc(p.title || '(제목 없음)')}</div>
          ${memo ? `<div class="k-memo">${esc(memo)}</div>` : ''}
          ${acts}
        </div>
        ${p.thumbnail ? `<img class="k-thumb" src="${esc(p.thumbnail)}" alt="" loading="lazy">` : ''}
      </button>`;
    }
    function renderBoard() {
      const list = filtered();
      const empty = st => st === 'trash' ? '휴지통이 비어 있어요' : st === 'hold' ? '보류할 글을 여기로 끌어 놓으세요' : '카드를 여기로 끌어 놓을 수 있어요';
      const col = (s, head) => {
        const all = list.filter(p => p.status === s.id), items = colItems(list, s.id);
        const n = items.length === all.length ? all.length : `${items.length} / ${all.length}`;
        return `<section class="col ${s.id === 'hold' || s.id === 'trash' ? 'box' : ''}" data-status="${s.id}">
          <div class="col-head">${head(n)}</div>
          <div class="col-hint">${COL_HINT[s.id]}</div>
          ${colToolsHTML(s.id)}
          <div class="col-body">${items.map(cardHTML).join('') || `<div class="col-empty">${all.length ? '이 기간에 해당하는 글이 없어요' : empty(s.id)}</div>`}</div>
        </section>`;
      };
      const nOf = st => list.filter(p => p.status === st).length;
      $('main').innerHTML = `<div class="board-wrap">${featBarHTML()}<div class="board">${BOARD_STATUSES.map(s => col(s, n => `<h2>${s.label}</h2><span class="n">${n}</span>
            <button class="add" data-add="${s.id}" title="${s.label}에 새 글">+</button>`)).join('')}${col(STATUSES.find(s => s.id === boxTab), () => `<div class="box-seg" role="tablist" aria-label="보관함">
              <button type="button" data-box="hold" class="${boxTab === 'hold' ? 'on' : ''}">보류함<small>${nOf('hold')}</small></button>
              <button type="button" data-box="trash" class="${boxTab === 'trash' ? 'on' : ''}">휴지통<small>${nOf('trash')}</small></button>
            </div>${boxTab === 'trash' && nOf('trash') ? '<button type="button" class="empty-trash" data-empty-trash>비우기</button>' : ''}`)}</div></div>`;
    }

    /* ---------- 추천글 (블로그 첫 화면 위쪽, 서비스별 최대 8개, featuredOrder 순) ---------- */
    const FEAT_MAX = 8;
    const featOrder = p => (typeof p.featuredOrder === 'number' ? p.featuredOrder : 999);
    function featuredOf(site) {
      return posts.filter(p => siteOf(p) === site && p.featured && p.status !== 'trash')
        .sort((a, b) => featOrder(a) - featOrder(b) || byDateDesc(a, b));
    }
    function featBarHTML() {
      const list = featuredOf(siteFilter);
      const pubN = list.filter(p => p.status === 'published').length;
      const slots = Array.from({ length: FEAT_MAX }, (_, i) => {
        const p = list[i];
        if (!p) return `<div class="fslot" data-fslot="${i}"><span class="no">${i + 1}</span>${i === list.length ? '여기로 끌어 놓기' : ''}</div>`;
        const img = p.thumbnail ? ` has-img" style="background-image:url('${esc(p.thumbnail)}')` : '';
        return `<div class="fslot" data-fslot="${i}"><div class="fcard${img}" draggable="true" data-fid="${p.id}" title="${esc(p.title || '')}">
          <span class="no">${i + 1}</span>${p.status !== 'published' ? '<span class="warn-pub" title="발행 전이라 블로그에는 아직 안 보여요">발행 전</span>' : ''}
          <span class="t">${esc(p.title || '(제목 없음)')}</span>
          <button type="button" class="x" data-unfeat="${p.id}" title="추천글에서 빼기">×</button>
        </div></div>`;
      }).join('');
      return `<section class="feat-bar" data-featbar>
        <div class="feat-head"><h2>★ 추천글</h2><span class="n">${list.length} / ${FEAT_MAX}</span>
          <span class="hint">블로그 첫 화면에 이 순서로 보여요 · 카드를 칸에 끌어 놓거나 ☆로 넣고, 칸끼리 끌어 순서를 바꿔요${pubN < 5 ? ' · 발행 글이 5개보다 적으면 나머지는 최신 글로 채워져요' : ''}</span></div>
        <div class="feat-slots">${slots}</div>
      </section>`;
    }
    // 원하는 추천글 순서(id 목록)대로 저장: 바뀐 글만 서버에 저장한다
    async function saveFeatured(ids) {
      let ok = true;
      for (const p of posts.filter(o => siteOf(o) === siteFilter)) {
        const i = ids.indexOf(p.id);
        const want = i >= 0 ? { featured: true, featuredOrder: i + 1 } : (p.featured && p.status !== 'trash' ? { featured: false } : null);
        if (!want || (p.featured === want.featured && featOrder(p) === (want.featuredOrder || 999))) continue;
        const c = clone(p);
        c.featured = want.featured;
        if (want.featuredOrder) c.featuredOrder = want.featuredOrder; else delete c.featuredOrder;
        if (!(await persistOne(c))) { ok = false; break; }
        posts[posts.findIndex(o => o.id === p.id)] = c;
        // 편집 창에 열려 있는 글이면 그쪽 값도 맞춘다 (나중에 저장할 때 덮어쓰지 않게)
        if (draft && draft.id === p.id) {
          draft.featured = c.featured;
          if (c.featuredOrder) draft.featuredOrder = c.featuredOrder; else delete draft.featuredOrder;
          const cb = document.querySelector('#drawer [data-k="featured"]'); if (cb) cb.checked = c.featured;
        }
      }
      renderMain();
      return ok;
    }
    function featIds() { return featuredOf(siteFilter).map(p => p.id); }
    function toggleFeatured(id) {
      const ids = featIds();
      if (ids.includes(id)) return saveFeatured(ids.filter(x => x !== id)).then(ok => ok && toast('추천글에서 뺐어요'));
      if (ids.length >= FEAT_MAX) { toast(`추천글은 ${FEAT_MAX}개까지예요. 하나를 빼고 넣어 주세요`); return; }
      return saveFeatured([...ids, id]).then(ok => ok && toast(`추천글 ${ids.length + 1}번으로 넣었어요`));
    }
    function placeFeatured(id, idx) {
      const ids = featIds(), had = ids.includes(id);
      if (!had && ids.length >= FEAT_MAX) { toast(`추천글은 ${FEAT_MAX}개까지예요. 하나를 빼고 넣어 주세요`); return; }
      const rest = ids.filter(x => x !== id);
      rest.splice(Math.min(idx, rest.length), 0, id);
      if (had && rest.join() === ids.join()) return;
      saveFeatured(rest).then(ok => ok && toast(had ? '추천글 순서를 바꿨어요' : `추천글 ${rest.indexOf(id) + 1}번으로 넣었어요`));
    }
    function renderTable() {
      const order = { idea: 0, draft: 1, published: 2, hold: 3 };
      const val = {
        title: p => p.title || '', status: p => order[p.status], category: p => p.category || '', date: p => postStamp(p), views: p => vw(p.id).total, d7: p => vw(p.id).d7,
      };
      const list = filtered().filter(p => p.status !== 'trash').sort((a, b) => {
        const x = val[sortKey](a), y = val[sortKey](b);
        return (x < y ? -1 : x > y ? 1 : 0) * sortDir || byDateDesc(a, b);
      });
      const th = (k, label, cls = '') => `<th data-sort="${k}" class="${cls} ${sortKey === k ? 'sorted' : ''}">${label}${sortKey === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
      $('main').innerHTML = `<div class="table-wrap"><table class="list">
        <thead><tr><th class="hide-m"></th>${th('title', '제목')}${th('status', '상태')}${th('category', '카테고리', 'hide-m')}${th('date', '날짜', 'hide-m')}${th('views', '조회수')}${th('d7', '최근 7일', 'hide-m')}</tr></thead>
        <tbody>${list.map(p => `<tr class="row ${draft && draft.id === p.id ? 'on' : ''}" data-id="${p.id}">
          <td class="hide-m">${p.thumbnail ? `<img class="th-img" src="${esc(p.thumbnail)}" alt="" loading="lazy">` : ''}</td>
          <td><div class="t">${p.featured ? '<span class="star">★</span> ' : ''}${esc(p.title || '(제목 없음)')}</div>${p.memo ? `<div class="memo">${esc(p.memo.split('\n')[0])}</div>` : ''}</td>
          <td><select data-status-of="${p.id}" aria-label="상태">${STATUSES.map(s => `<option value="${s.id}" ${p.status === s.id ? 'selected' : ''}>${s.label}</option>`).join('')}</select></td>
          <td class="hide-m nowrap"><span class="cat ${esc(p.category)}">${esc(catLabel(p.category))}</span></td>
          <td class="hide-m nowrap"><small class="muted">${postDayLabel(p)}</small> ${fmtDate(postDay(p))}</td>
          <td class="num">${p.status === 'published' || vw(p.id).total ? fmtN(vw(p.id).total) : '-'}</td>
          <td class="num hide-m">${vw(p.id).d7 ? '+' + fmtN(vw(p.id).d7) : '-'}</td>
        </tr>`).join('') || '<tr><td colspan="7" class="col-empty">글이 없습니다</td></tr>'}</tbody>
      </table></div>`;
    }
    /* ---------- 설문 결과 ---------- */
    /* 설문 결과는 서비스 + 기간별로 불러온다 (한국 시간 기준) */
    const SURVEY_DATA = {};   // '서비스|from|to' → 응답 목록
    const KST = 9 * 3600e3, DAYMS = 864e5;
    const kstToday = () => new Date(Date.now() + KST).toISOString().slice(0, 10);
    const dayStart = d => Date.parse(d + 'T00:00:00+09:00');           // 'YYYY-MM-DD' → 그날 0시(밀리초)
    const ymd = ms => new Date(ms + KST).toISOString().slice(0, 10);     // 밀리초 → 'YYYY-MM-DD'
    const addDays = (d, n) => ymd(dayStart(d) + n * DAYMS);
    const PERIODS = [
      { id: 'today', label: '오늘' }, { id: '7d', label: '최근 7일' }, { id: '30d', label: '최근 30일' },
      { id: 'month', label: '이번 달' }, { id: 'lastmonth', label: '지난 달' }, { id: 'all', label: '전체' }, { id: 'custom', label: '직접 지정' },
    ];
    let svPeriod = { id: '30d', from: '', to: '' };
    let svProfile = { gender: '', age: '' };   // 응답자 거르기 (빈 값 = 전체)
    try { const sp = JSON.parse(localStorage.getItem('selb_admin_svperiod') || 'null'); if (sp && sp.id) svPeriod = sp; } catch (e) {}
    // 고른 기간 → { from, to(다음 날 0시, 미포함), label }
    function periodRange(pr) {
      const t = kstToday(), tomorrow = dayStart(addDays(t, 1));
      const m1 = t.slice(0, 8) + '01';
      if (pr.id === 'today') return { from: dayStart(t), to: tomorrow };
      if (pr.id === '7d') return { from: dayStart(addDays(t, -6)), to: tomorrow };
      if (pr.id === '30d') return { from: dayStart(addDays(t, -29)), to: tomorrow };
      if (pr.id === 'month') return { from: dayStart(m1), to: tomorrow };
      if (pr.id === 'lastmonth') { const lm = ymd(dayStart(m1) - DAYMS).slice(0, 8) + '01'; return { from: dayStart(lm), to: dayStart(m1) }; }
      if (pr.id === 'custom' && pr.from && pr.to) {
        const a = pr.from <= pr.to ? pr.from : pr.to, b = pr.from <= pr.to ? pr.to : pr.from;
        return { from: dayStart(a), to: dayStart(addDays(b, 1)) };
      }
      return { from: 0, to: tomorrow }; // 전체
    }
    const svKey = () => { const r = periodRange(svPeriod); return siteFilter + '|' + r.from + '|' + r.to; };
    async function loadSurvey(force) {
      if (!ONLINE || !window.BLOG_ADMIN) return;
      const key = svKey();
      if (SURVEY_DATA[key] && !force) return;
      const r = periodRange(svPeriod);
      try { SURVEY_DATA[key] = await api('GET', 'survey?site=' + siteFilter + '&from=' + r.from + '&to=' + r.to); } catch (e) { SURVEY_DATA[key] = []; }
      if (view === 'survey') renderMain();
    }
    /* ---------- 설정 (서비스별 설문) ---------- */
    const ST = {};   // 서비스별 편집 중인 설정 { cfg, dirty }
    function stState() {
      if (!ST[siteFilter]) ST[siteFilter] = { cfg: surveyConfig(siteFilter), dirty: false };
      return ST[siteFilter];
    }
    const stSaved = () => !!(window.BLOG_SURVEY && window.BLOG_SURVEY[siteFilter]);
    /* ---------- 매일 자동 초안 (SelB) ---------- */
    let AD = null, adBusy = false;   // { config, log, hasKey, categories }
    async function loadAutodraft() {
      if (!ONLINE || !window.BLOG_ADMIN) return;
      try { AD = await api('GET', 'autodraft'); } catch (e) { AD = { error: e.message }; }
      if (view === 'settings' && siteFilter === 'selb') renderSettings();
    }
    function autodraftCard() {
      if (!ONLINE) return '<div class="st-card"><h3>매일 자동 초안</h3><p class="d">블로그 서버의 관리자 페이지에서 설정할 수 있어요.</p></div>';
      if (!AD) { loadAutodraft(); return '<div class="st-card"><h3>매일 자동 초안</h3><p class="d">불러오는 중…</p></div>'; }
      if (AD.error) return `<div class="st-card"><h3>매일 자동 초안</h3><p class="d">불러오지 못했어요: ${esc(AD.error)}</p></div>`;
      const c = AD.config, cats = AD.categories;
      const when = t => new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      return `<div class="st-card ad-card">
        <div class="st-head"><h3>매일 자동 초안</h3>
          <span class="st-state">${AD.hasKey ? (c.enabled ? '켜짐 · 매일 오전 6시' : '꺼짐') : '<b style="color:#D33A3A">Claude API 키가 없어 아직 동작하지 않아요</b>'}</span></div>
        <p class="d" style="margin-top:6px">매일 오전 6시(한국 시간)에 고른 카테고리마다 글 한 편씩 Claude가 써서 <b>초안</b>으로 저장해요. 이벤트, 고객 인터뷰·고객 이야기·후기처럼 실제 사례로 보일 수 있는 글은 만들지 않아요. 발행은 직접 확인한 뒤에 해 주세요.</p>
        ${AD.hasKey ? '' : '<p class="d" style="color:#D33A3A">터미널에서 <code>npx wrangler secret put ANTHROPIC_API_KEY</code> 로 키를 넣으면 바로 동작해요.</p>'}
        <label class="st-switch"><input type="checkbox" id="adEnabled" ${c.enabled ? 'checked' : ''}> 매일 자동으로 초안 만들기</label>
        <div class="ad-cats">${Object.entries(cats).map(([id, x]) => `<label><input type="checkbox" data-adcat="${id}" ${c.categories.includes(id) ? 'checked' : ''}> ${x.label}</label>`).join('')}<label class="off"><input type="checkbox" disabled> 이벤트 <small>(만들지 않아요)</small></label></div>
        <div class="ad-run">
          <select id="adRunCat">${Object.entries(cats).map(([id, x]) => `<option value="${id}">${x.label}</option>`).join('')}</select>
          <button class="btn btn-sm btn-primary" id="adRun" ${AD.hasKey && !adBusy ? '' : 'disabled'}>${adBusy ? '만드는 중… 1~3분 걸려요' : '지금 한 편 만들어 보기'}</button>
          <button class="btn btn-sm" id="adReload">기록 새로고침</button>
        </div>
        <div class="ad-log">${(AD.log || []).slice(0, 14).map(l => `<div class="ad-row ${l.ok ? 'ok' : 'fail'}">
            <span class="t">${when(l.at)}</span><span class="c">${esc((cats[l.category] || {}).label || l.category)}</span><span class="w">${l.trigger === 'cron' ? '매일' : '직접'}</span>
            <span class="r">${l.ok ? `<a href="#" data-open="${l.postId}">${esc(l.title)}</a> <small>${l.chars ? l.chars + '자' : ''}</small>` : '실패 · ' + esc(l.error || '')}</span></div>`).join('') || '<div class="sv-empty">아직 만든 초안이 없어요.</div>'}</div>
      </div>`;
    }
    async function saveAutodraft() {

    function stRead(el) {

      if (b.id === 'stSave') {

    function renderSurvey() {

      const pct = (n, t) => t ? Math.round(n / t * 100) : 0;
      const title = id => { const p = posts.find(x => x.id === id); return p ? p.title : '(지운 글)'; };

      const helpful = rows.filter(r => r.qid === 'helpful');

      const comments = rows.filter(r => r.comment);

      // 날짜별 응답 수 (기간이 92일을 넘으면 주 단위)

        const first = R.from || dayStart(ymd(Math.min(...rows.map(r => r.created_at))));

        rows.forEach(r => { const i = Math.floor((r.created_at - first) / (step * DAYMS)); if (buckets[i]) { buckets[i].n++; if (r.comment) buckets[i].c++; } });

      const qCards = qList.map(q => {

        return `<div class="sv-q"><div class="tp">${esc(q.topic)}</div><h4>${esc(q.q)}</h4><div class="cnt">응답 ${fmtN(rs.length)}건</div>

      $('main').innerHTML = `<div class="sv-wrap">

          ${scored.length ? `<table><thead><tr><th>글</th><th class="n">응답</th><th class="n">평균</th><th class="n">전체 조회수</th></tr></thead><tbody>${scored.map(x => `<tr data-id="${x.id}"><td>${esc(title(x.id))}</td><td class="n">${x.n}</td><td class="n">${x.avg.toFixed(1)}점</td><td class="n">${fmtN(vw(x.id).total)}</td></tr>`).join('')}</tbody></table>` : '<div class="sv-empty">이 기간에 응답이 없어요.</div>'}

        rows.slice().reverse().forEach(r => {

    // 기간 막대의 단추들

    function renderMain() {
      renderChips();
      // 다시 그려도 스크롤 위치 유지

      document.body.classList.toggle('view-wide', view === 'survey' || view === 'settings');
      view === 'list' ? renderTable() : view === 'survey' ? renderSurvey() : view === 'settings' ? renderSettings() : renderBoard();
      document.querySelectorAll('#main .col-body, #main .table-wrap, #main .board').forEach(el => {
        const p = pos[key(el)]; if (p) { el.scrollTop = p[0]; el.scrollLeft = p[1]; }

    }

    /* 상태 바꾸기 (끌어 놓기, 목록의 선택 상자) */
    /* 상태가 바뀔 때 날짜 정리: 발행하는 순간이 발행일, 휴지통은 지운 시각과 이전 상태를 기억 */
    const STATUS_KEYS = ['status', 'date', 'publishedAt', 'created', 'createdAt', 'prevStatus', 'trashedAt', 'heldAt', 'featured', 'featuredOrder'];
    function applyStatus(p, status, opts = {}) {
      const from = p.status;
      if (!p.created) p.created = p.date || todayStr();
      if (status === 'published' && from !== 'published' && !opts.restore) { p.date = todayStr(); p.publishedAt = Date.now(); }
      if (status === 'trash') { p.prevStatus = from; p.trashedAt = Date.now(); p.featured = false; delete p.featuredOrder; } // 지운 글은 추천글에서 빠진다
      else { delete p.trashedAt; delete p.prevStatus; }
      if (status === 'hold') p.heldAt = Date.now(); else delete p.heldAt;
      p.status = status;
    }
    /* 상태를 바꿔도 되는지 묻기 (발행·발행 취소·삭제) */
    function confirmStatus(p, status, opts = {}) {
      const t = `"${p.title || '(제목 없음)'}"`;
      if (status === 'published' && !p.title.trim()) { alert('제목이 있어야 발행할 수 있어요.'); return false; }
      if (status === 'published' && !opts.restore) return confirm(`${t} 글을 발행할까요?\n저장하면 블로그에 바로 공개되고, 오늘(${fmtDate(todayStr())})이 발행일이 돼요.`);
      if (status === 'published' && opts.restore) return confirm(`${t} 글을 복원할까요?\n발행 글이라 블로그에 다시 공개돼요.`);
      if (p.status === 'published' && status === 'trash') return confirm(`${t} 글을 휴지통으로 옮길까요?\n블로그에서 이 글이 내려가요.`);
      if (p.status === 'published') return confirm(`${t} 글의 발행을 취소할까요?\n블로그에서 이 글이 내려가요.`);
      return true;
    }
    async function changeStatus(id, status, opts = {}) {
      const p = draft && draft.id === id ? draft : posts.find(o => o.id === id);
      if (!p || p.status === status) return;
      if (!confirmStatus(p, status, opts)) { renderMain(); return; }
      const next = clone(p);
      applyStatus(next, status, opts);
      normalize(next);
      if (await storePost(next)) {
        if (draft && draft.id === id) {
          STATUS_KEYS.forEach(k => { if (k in next) draft[k] = next[k]; else delete draft[k]; });
          Object.assign(draft, { slug: next.slug, slugAuto: next.slugAuto }); dirty = false; refreshStatusUI();
          const se = document.querySelector('[data-k="slug"]'); if (se) se.value = draft.slug;
        }
        toast(status === 'trash' ? '휴지통으로 옮겼어요' : opts.restore ? `'${statusLabel(status)}'(으)로 복원했어요` : `'${statusLabel(status)}'(으)로 옮겼어요`);
      } else renderMain();
    }
    /* 영구 삭제 (휴지통에서만) */
    async function purgePosts(ids) {
      for (const id of ids) {
        if (!unsavedIds.has(id) && ONLINE && !(await persistDelete(id))) { renderMain(); return false; }
        posts = posts.filter(p => p.id !== id);
        unsavedIds.delete(id);
        if (!ONLINE) { try { localStorage.setItem(SKIP_KEY, JSON.stringify([...skipIds(), id])); } catch (err) {} }
      }
      if (!ONLINE) persistLocal();
      renderMain();
      return true;
    }

    /* ---------- 편집 창 ---------- */
    function openPost(id) {
      const p = posts.find(o => o.id === id);
      if (!p) return;
      draft = clone(p);
      dirty = false; editVer = 0;
      $('drawer').hidden = false; $('backdrop').hidden = false;
      renderEditor();
      renderMain();
      $('drawer').querySelector('.ed-body').scrollTop = 0;
      if (!draft.title) setTimeout(() => $('drawer').querySelector('.title-input').focus(), 0);
    }
    async function closeEditor() {
      if (!draft) return;
      if (unsavedIds.has(draft.id) && !draft.title.trim()) {
        // 제목 없이 만든 새 글은 그냥 버린다
        posts = posts.filter(p => p.id !== draft.id);
        unsavedIds.delete(draft.id);
        dirty = false;
      }
      if (dirty) {
        if (draft.status === 'published') {
          if (!confirm('발행된 글의 바뀐 내용을 저장하지 않았어요. 저장하지 않고 닫을까요?')) return;
        } else if (!(await save({ silent: true }))) {
          if (!confirm('저장하지 못했어요. 그래도 닫을까요?')) return;
        }
      }
      clearTimeout(autoTimer);
      draft = null; dirty = false;
      $('drawer').hidden = true; $('backdrop').hidden = true;
      destroyEditor();
      $('drawer').innerHTML = '';
      renderMain();
    }

            <textarea class="memo" data-k="memo" placeholder="이 글을 왜 쓰는지, 누구에게, 어떤 내용을 담을지 적어 두세요">${esc(d.memo)}</textarea>

            <textarea id="bodyEditor" hidden></textarea>

              <label class="f col-2">태그 <small>쉼표로 구분</small><input type="text" data-k="tags" value="${esc((d.tags || []).join(', '))}" placeholder="AI명함, 셀프브랜딩"></label>

            </div>

    /* ---------- 본문 에디터 (SunEditor) ---------- */
    let editor = null;
    let editorReady = false;
    function destroyEditor() {
      if (editor) { try { editor.destroy(); } catch (e) {} }
      editor = null; editorReady = false;
    }
    const VIDEO_MAX = 95 * 1024 * 1024;
    async function uploadMedia(file, kind) {
      if (kind === 'image') {
        // GIF는 움직임이 사라지지 않게 그대로 올린다
        if (file.type === 'image/gif' && ONLINE) return (await api('POST', 'upload', file, 'image/gif')).url;
        return imageValue(file, 1400);
      }
      if (!ONLINE) throw new Error('영상 파일 올리기는 블로그 서버에서 글 관리를 열었을 때만 돼요. 유튜브 주소로 넣어 주세요.');
      if (file.size > VIDEO_MAX) throw new Error('영상은 95MB 이하만 올릴 수 있어요. 더 큰 영상은 유튜브에 올린 뒤 주소로 넣어 주세요.');
      const type = file.type || (/\.mov$/i.test(file.name) ? 'video/quicktime' : 'video/mp4');
      toast('영상을 올리는 중… 크기에 따라 시간이 걸려요');
      return (await api('POST', 'upload', file, type)).url;
    }
    function uploadHook(kind) {
      return (files, info, core, uploadHandler) => {
        Promise.all([...files].map(async f => ({ url: await uploadMedia(f, kind), name: f.name, size: f.size })))
          .then(result => { uploadHandler({ result }); toast(kind === 'image' ? '사진을 넣었어요' : '영상을 넣었어요'); })
          .catch(err => uploadHandler(err.message || '올리지 못했어요'));
        return undefined; // 업로드가 끝나면 uploadHandler로 넣는다
      };
    }
    function initBodyEditor() {
      destroyEditor();

      if (draft.format !== 'html') {

        draft.format = 'html';
        draft.images = {};

      editor = SUNEDITOR.create('bodyEditor', {
        lang: SUNEDITOR_LANG.ko,
        width: '100%', height: 'auto', minHeight: '460px',
        stickyToolbar: -1,
